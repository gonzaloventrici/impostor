[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "impostor"
version = "0.1.0"
description = "Juego del impostor"
requires-python = ">=3.10"
dependencies = [
    "mysql-connector-python>=8.0",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

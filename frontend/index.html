<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Impostor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14121A;
    --surface: #1F1B29;
    --surface-2: #29233A;
    --text: #F5F3F0;
    --muted: #8B8594;
    --spy: #E63946;
    --spy-dark: #7A1620;
    --word: #F2C14E;
    --word-dark: #8A6A12;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }

  .app { width: 100%; max-width: 420px; }

  h1.brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem;
    letter-spacing: 0.08em;
    text-align: center;
    margin: 0 0 8px;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    margin: 0 0 32px;
    font-size: 0.95rem;
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 16px;
  }

  .mode-choice { display: flex; flex-direction: column; gap: 14px; }

  button {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    border: none;
    border-radius: 12px;
    padding: 16px 20px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.97); }

  .btn-primary { background: var(--word); color: #26200A; }
  .btn-secondary { background: var(--surface-2); color: var(--text); }
  .btn-danger { background: var(--spy); color: #FCEBEC; }
  .btn-block { width: 100%; }

  input[type="text"], input[type="number"], select {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid #3A3350;
    color: var(--text);
    border-radius: 10px;
    padding: 14px;
    font-size: 1rem;
    font-family: 'Work Sans', sans-serif;
    margin-bottom: 12px;
  }

  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .player-list {
    list-style: none;
    padding: 0;
    margin: 0 0 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .player-list li {
    background: var(--surface);
    border: 1px solid #3A3350;
    padding: 12px 14px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
  }

  .room-code {
    text-align: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem;
    letter-spacing: 0.15em;
    color: var(--word);
    margin: 8px 0 20px;
  }

  .error {
    background: rgba(230, 57, 70, 0.15);
    border: 1px solid var(--spy);
    color: #FCA5AC;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }

  .hidden { display: none !important; }

  .handoff { text-align: center; padding: 60px 20px; }
  .handoff .name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.8rem;
    margin: 16px 0 32px;
  }

  .reveal-card {
    aspect-ratio: 3/4;
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    cursor: pointer;
    user-select: none;
    transition: background 0.3s ease;
  }
  .reveal-card.unrevealed {
    background: linear-gradient(160deg, var(--surface-2), var(--surface));
    border: 2px dashed #4A4260;
  }
  .reveal-card.unrevealed .hint { color: var(--muted); font-size: 1rem; }
  .reveal-card.spy { background: linear-gradient(160deg, var(--spy), var(--spy-dark)); }
  .reveal-card.word { background: linear-gradient(160deg, var(--word), var(--word-dark)); }
  .reveal-card .role-title { font-size: 2.2rem; margin-bottom: 12px; }
  .reveal-card.word .role-title, .reveal-card.word .role-word { color: #26200A; }
  .reveal-card.spy .role-title, .reveal-card.spy .role-sub { color: #FCEBEC; }
  .role-word { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.05em; }
  .role-sub { font-size: 0.95rem; opacity: 0.85; }

  .top-nav { text-align: left; margin-bottom: 20px; }
  .top-nav button {
    background: none;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .top-nav button .arrow {
    color: var(--word);
    font-size: 1.3rem;
    text-shadow: 0 0 1px var(--word), 0 0 1px var(--word), 0.5px 0 0 var(--word), -0.5px 0 0 var(--word);
  }

  .waiting-text { text-align:center; color: var(--muted); margin-top: 16px; }
  .status-ok { text-align:center; color: var(--word); font-weight:600; margin-bottom: 6px; }
</style>
</head>
<body>

<div class="app">
  <h1 class="brand">IMPOSTOR</h1>
  <p class="subtitle">Uno no sabe la palabra. Descubran quién.</p>

  <div id="error-box" class="error hidden"></div>

  <!-- Pantalla: elegir modo -->
  <div id="screen-mode" class="card">
    <div class="mode-choice">
      <button class="btn-primary btn-block" onclick="goLocal()">📱 Un dispositivo (pasar y jugar)</button>
      <button class="btn-secondary btn-block" onclick="goOnlineHost()">🌐 Cada uno desde su celular</button>
      <button class="btn-secondary btn-block" onclick="goOnlineJoin()">🔑 Unirme con un código</button>
    </div>
  </div>

  <!-- Pantalla: modo LOCAL (el host carga a todos los jugadores) -->
  <div id="screen-setup" class="card hidden">
    <div class="top-nav"><button onclick="showScreen('mode')"><span class="arrow">←</span> Volver</button></div>

    <label>Nombre del jugador</label>
    <input type="text" id="input-player-name" placeholder="Ej: Nico">
    <button class="btn-primary btn-block" onclick="addPlayer()" style="margin-bottom: 20px;">+ Agregar jugador</button>

    <ul id="player-list" class="player-list"></ul>

    <label>Cantidad de impostores</label>
    <input type="number" id="input-num-spies" min="1" value="1">

    <label>Categoría</label>
    <select id="select-category"><option value="">Aleatoria</option></select>

    <button class="btn-primary btn-block" onclick="startLocalGame()" style="margin-top: 10px;">Empezar partida</button>
  </div>

  <!-- Pantalla: modo ONLINE HOST -->
  <div id="screen-online-host" class="card hidden">
    <div class="top-nav"><button onclick="showScreen('mode')"><span class="arrow">←</span> Volver</button></div>

    <!-- Paso 1: el host carga su propio nombre -->
    <div id="host-join-step">
      <label>Tu nombre</label>
      <input type="text" id="input-host-name" placeholder="Ej: Gonzalo">
      <button class="btn-primary btn-block" onclick="hostJoin()">Crear sala</button>
    </div>

    <!-- Paso 2: sala creada, esperando jugadores + configuración -->
    <div id="host-lobby-step" class="hidden">
      <div class="room-code" id="host-room-code"></div>
      <p style="text-align:center; color: var(--muted); font-size: 0.85rem; margin-bottom: 20px;">
        Compartí este código. Cada jugador entra a esta misma página, toca
        "Unirme con un código" y carga su propio nombre.
      </p>

      <label>Jugadores en la sala</label>
      <ul id="host-players-list" class="player-list"></ul>

      <label>Cantidad de impostores</label>
      <input type="number" id="input-host-num-spies" min="1" value="1">

      <label>Categoría</label>
      <select id="select-host-category"><option value="">Aleatoria</option></select>

      <button class="btn-primary btn-block" onclick="startOnlineGame()" style="margin-top: 10px;">Empezar partida</button>
    </div>
  </div>

  <!-- Pantalla: unirse a sala existente (online, no-host) -->
  <div id="screen-join" class="card hidden">
    <div class="top-nav"><button onclick="showScreen('mode')"><span class="arrow">←</span> Volver</button></div>
    <label>Código de sala</label>
    <input type="text" id="input-join-code" placeholder="Ej: 7F3K2" style="text-transform: uppercase;">
    <label>Tu nombre</label>
    <input type="text" id="input-join-name" placeholder="Ej: Caro">
    <button class="btn-primary btn-block" onclick="joinRoom()">Unirme</button>
    <p id="join-waiting" class="waiting-text hidden">Esperando a que el host inicie la partida…</p>
  </div>

  <!-- Pantalla: "pasá el teléfono a X" (solo modo local) -->
  <div id="screen-handoff" class="handoff hidden">
    <p style="color: var(--muted);">Pasále el dispositivo a</p>
    <div class="name" id="handoff-name"></div>
    <button class="btn-primary" onclick="showRevealForCurrent()">Ya lo tengo, mostrar mi rol</button>
  </div>

  <!-- Pantalla: revelación de rol -->
  <div id="screen-reveal" class="hidden">
    <div id="reveal-card" class="reveal-card unrevealed" onclick="flipCard()">
      <div class="hint">Tocá para ver tu rol</div>
    </div>
    <button id="btn-next-player" class="btn-secondary btn-block hidden" style="margin-top:16px;" onclick="nextLocalPlayer()">Siguiente jugador</button>
    <button id="btn-play-again" class="btn-primary btn-block hidden" style="margin-top:16px;" onclick="resetToLobby()">Jugar de nuevo</button>
  </div>
</div>

<script>
  // Cambiar esta URL si el backend corre en otro host/puerto
  const API_BASE = "http://192.168.0.232:8000";

  let mode = null;        // "local" | "online-host" | "online-join"
  let roomCode = null;
  let hostToken = null;   // token de administración de la sala (solo online-host)

  // Modo local: un dispositivo cicla por varios jugadores
  let localPlayers = [];  // {player_id, name, token}
  let localIndex = 0;

  // Modo online (host jugando o alguien que se unió con código):
  // cada dispositivo solo necesita SU PROPIO player_id/token
  let myPlayerId = null;
  let myToken = null;

  let hostPollTimer = null;
  let joinPollTimer = null;

  function showScreen(name) {
    document.querySelectorAll('.card, .handoff, #screen-reveal').forEach(el => el.classList.add('hidden'));
    document.getElementById('screen-' + name).classList.remove('hidden');
    hideError();
    stopAllPolling();
  }

  function stopAllPolling() {
    if (hostPollTimer) { clearInterval(hostPollTimer); hostPollTimer = null; }
    if (joinPollTimer) { clearTimeout(joinPollTimer); joinPollTimer = null; }
  }

  function showError(msg) {
    const box = document.getElementById('error-box');
    box.textContent = msg;
    box.classList.remove('hidden');
  }
  function hideError() {
    document.getElementById('error-box').classList.add('hidden');
  }

  async function loadCategoriesInto(selectId) {
    try {
      const res = await fetch(`${API_BASE}/categories`);
      const categories = await res.json();
      const select = document.getElementById(selectId);
      select.innerHTML = '<option value="">Aleatoria</option>';
      categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        select.appendChild(opt);
      });
    } catch (e) {
      console.warn("No se pudieron cargar categorías (¿backend corriendo?)", e);
    }
  }

  // ==================== MODO LOCAL ====================
  async function goLocal() {
    try {
      mode = "local";
      localPlayers = [];
      const res = await fetch(`${API_BASE}/rooms`, { method: 'POST' });
      if (!res.ok) throw new Error("Error del servidor: " + res.status);
      const data = await res.json();
      roomCode = data.room_code;
      hostToken = data.host_token;
      renderPlayerList();
      loadCategoriesInto('select-category');
      showScreen('setup');
    } catch (e) {
      showError("No se pudo conectar al servidor: " + e.message);
    }
  }

  async function addPlayer() {
    const input = document.getElementById('input-player-name');
    const name = input.value.trim();
    if (!name) return;

    try {
      const res = await fetch(`${API_BASE}/rooms/${roomCode}/join`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      if (!res.ok) throw new Error((await res.json()).detail);
      const data = await res.json();
      localPlayers.push({ player_id: data.player_id, name, token: data.player_token });
      input.value = '';
      renderPlayerList();
      hideError();
    } catch (e) {
      showError(e.message);
    }
  }

  function renderPlayerList() {
    const ul = document.getElementById('player-list');
    ul.innerHTML = '';
    localPlayers.forEach(p => {
      const li = document.createElement('li');
      li.textContent = p.name;
      ul.appendChild(li);
    });
  }

  async function startLocalGame() {
    const numSpies = parseInt(document.getElementById('input-num-spies').value, 10);
    const categoryValue = document.getElementById('select-category').value;
    const categoryId = categoryValue ? parseInt(categoryValue, 10) : null;

    try {
      const res = await fetch(`${API_BASE}/rooms/${roomCode}/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ host_token: hostToken, num_spies: numSpies, category_id: categoryId })
      });
      if (!res.ok) throw new Error((await res.json()).detail);
      localIndex = 0;
      showHandoffForCurrent();
    } catch (e) {
      showError(e.message);
    }
  }

  function showHandoffForCurrent() {
    const player = localPlayers[localIndex];
    document.getElementById('handoff-name').textContent = player.name;
    showScreen('handoff');
  }

  function showRevealForCurrent() {
    showScreen('reveal');
    resetCard();
    document.getElementById('btn-next-player').classList.toggle('hidden', localIndex >= localPlayers.length - 1);
    document.getElementById('btn-play-again').classList.toggle('hidden', localIndex < localPlayers.length - 1);
  }

  function nextLocalPlayer() {
    localIndex++;
    showHandoffForCurrent();
  }

  // ==================== MODO ONLINE - HOST ====================
  async function goOnlineHost() {
    try {
      mode = "online-host";
      document.getElementById('host-join-step').classList.remove('hidden');
      document.getElementById('host-lobby-step').classList.add('hidden');
      document.getElementById('input-host-name').value = '';

      const res = await fetch(`${API_BASE}/rooms`, { method: 'POST' });
      if (!res.ok) throw new Error("Error del servidor: " + res.status);
      const data = await res.json();
      roomCode = data.room_code;
      hostToken = data.host_token;
      showScreen('online-host');
    } catch (e) {
      showError("No se pudo conectar al servidor: " + e.message);
    }
  }

  async function hostJoin() {
    const name = document.getElementById('input-host-name').value.trim();
    if (!name) return;

    try {
      const res = await fetch(`${API_BASE}/rooms/${roomCode}/join`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      if (!res.ok) throw new Error((await res.json()).detail);
      const data = await res.json();
      myPlayerId = data.player_id;
      myToken = data.player_token;

      document.getElementById('host-room-code').textContent = roomCode;
      document.getElementById('host-join-step').classList.add('hidden');
      document.getElementById('host-lobby-step').classList.remove('hidden');
      loadCategoriesInto('select-host-category');
      startHostPolling();
      hideError();
    } catch (e) {
      showError(e.message);
    }
  }

  function startHostPolling() {
    refreshHostPlayers();
    hostPollTimer = setInterval(refreshHostPlayers, 2000);
  }

  async function refreshHostPlayers() {
    try {
      const res = await fetch(`${API_BASE}/rooms/${roomCode}`);
      const data = await res.json();
      const ul = document.getElementById('host-players-list');
      ul.innerHTML = '';
      data.players.forEach(p => {
        const li = document.createElement('li');
        li.textContent = p.name;
        ul.appendChild(li);
      });
    } catch (e) { /* seguimos intentando en el próximo tick */ }
  }

  async function startOnlineGame() {
    const numSpies = parseInt(document.getElementById('input-host-num-spies').value, 10);
    const categoryValue = document.getElementById('select-host-category').value;
    const categoryId = categoryValue ? parseInt(categoryValue, 10) : null;

    try {
      const res = await fetch(`${API_BASE}/rooms/${roomCode}/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ host_token: hostToken, num_spies: numSpies, category_id: categoryId })
      });
      if (!res.ok) throw new Error((await res.json()).detail);

      if (hostPollTimer) { clearInterval(hostPollTimer); hostPollTimer = null; }

      showScreen('reveal');
      resetCard();
      document.getElementById('btn-next-player').classList.add('hidden');
      document.getElementById('btn-play-again').classList.remove('hidden');
    } catch (e) {
      showError(e.message);
    }
  }

  // ==================== MODO ONLINE - UNIRSE CON CÓDIGO ====================
  function goOnlineJoin() {
    mode = "online-join";
    document.getElementById('input-join-code').value = '';
    document.getElementById('input-join-name').value = '';
    document.getElementById('join-waiting').classList.add('hidden');
    showScreen('join');
  }

  async function joinRoom() {
    const code = document.getElementById('input-join-code').value.trim().toUpperCase();
    const name = document.getElementById('input-join-name').value.trim();
    if (!code || !name) return;

    try {
      const res = await fetch(`${API_BASE}/rooms/${code}/join`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      if (!res.ok) throw new Error((await res.json()).detail);
      const data = await res.json();
      roomCode = code;
      myPlayerId = data.player_id;
      myToken = data.player_token;
      hideError();
      document.getElementById('join-waiting').classList.remove('hidden');
      pollForStart();
    } catch (e) {
      showError(e.message);
    }
  }

  async function pollForStart() {
    try {
      const res = await fetch(`${API_BASE}/rooms/${roomCode}`);
      const data = await res.json();
      if (data.status === "started") {
        showScreen('reveal');
        document.getElementById('btn-next-player').classList.add('hidden');
        document.getElementById('btn-play-again').classList.remove('hidden');
        resetCard();
        return;
      }
    } catch (e) { /* seguimos intentando */ }
    joinPollTimer = setTimeout(pollForStart, 1500);
  }

  // ==================== REVELACIÓN DE ROL (compartida) ====================
  let cachedRole = null;

  function resetCard() {
    const card = document.getElementById('reveal-card');
    card.className = 'reveal-card unrevealed';
    card.innerHTML = '<div class="hint">Tocá para ver tu rol</div>';
    card.dataset.state = "hidden";
    cachedRole = null;
  }

  function renderRole(card, data) {
    if (data.is_spy) {
      card.className = 'reveal-card spy';
      card.innerHTML = `
        <div class="role-title">SOS EL<br>IMPOSTOR</div>
        <div class="role-sub">No sabés la palabra. Disimulá.</div>`;
    } else {
      card.className = 'reveal-card word';
      card.innerHTML = `
        <div class="role-title">LA PALABRA ES</div>
        <div class="role-word">${data.word.toUpperCase()}</div>`;
    }
  }

  async function flipCard() {
    const card = document.getElementById('reveal-card');

    // Si ya está revelada, la próxima vez que tocan la ocultamos
    if (card.dataset.state === "revealed") {
      card.className = 'reveal-card unrevealed';
      card.innerHTML = '<div class="hint">Tocá para volver a ver tu rol</div>';
      card.dataset.state = "hidden";
      return;
    }

    // Si ya la pedimos antes, no volvemos a llamar al servidor
    if (cachedRole) {
      renderRole(card, cachedRole);
      card.dataset.state = "revealed";
      return;
    }

    const playerId = (mode === "local") ? localPlayers[localIndex].player_id : myPlayerId;
    const token = (mode === "local") ? localPlayers[localIndex].token : myToken;

    try {
      const res = await fetch(
        `${API_BASE}/rooms/${roomCode}/players/${playerId}/role?player_token=${token}`
      );
      if (!res.ok) throw new Error((await res.json()).detail);
      const data = await res.json();
      cachedRole = data;
      renderRole(card, data);
      card.dataset.state = "revealed";
    } catch (e) {
      showError(e.message);
    }
  }

  // ==================== VOLVER A JUGAR ====================
  async function resetToLobby() {
    try {
      if (mode === "local") {
        await fetch(`${API_BASE}/rooms/${roomCode}/reset?host_token=${hostToken}`, { method: 'POST' });
        renderPlayerList();
        showScreen('setup');
      } else if (mode === "online-host") {
        await fetch(`${API_BASE}/rooms/${roomCode}/reset?host_token=${hostToken}`, { method: 'POST' });
        document.getElementById('host-lobby-step').classList.remove('hidden');
        showScreen('online-host');
        startHostPolling();
      } else {
        // online-join: solo esperamos a que el host arranque otra ronda
        showScreen('join');
        document.getElementById('join-waiting').classList.remove('hidden');
        pollForStart();
      }
    } catch (e) {
      showError(e.message);
    }
  }

  showScreen('mode');
</script>

</body>
</html>
